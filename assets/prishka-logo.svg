<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-label="Prishka Annam Brand Logo">
  <defs>
    <!-- Rich Embossed Gold Gradient -->
    <linearGradient id="embossGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4A0"/>
      <stop offset="25%" stop-color="#E5B255"/>
      <stop offset="50%" stop-color="#FFF2CA"/>
      <stop offset="75%" stop-color="#C58D2B"/>
      <stop offset="100%" stop-color="#F2CA72"/>
    </linearGradient>

    <!-- Warm Golden Light Gradient -->
    <linearGradient id="flameGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C58D2B"/>
      <stop offset="60%" stop-color="#FCE197"/>
      <stop offset="100%" stop-color="#FFFDF5"/>
    </linearGradient>

    <!-- Drop Shadow for Embossed 3D feel -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4A1404" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- ══════════════════════════════════════════════════════════
         1. TOP ARCH RING & FLAME DROPLET
         ══════════════════════════════════════════════════════════ -->
    <!-- Golden Arch Ring -->
    <path d="M 220,136 A 85,85 0 0,1 380,136" 
          fill="none" 
          stroke="url(#embossGold)" 
          stroke-width="7" 
          stroke-linecap="round"/>

    <!-- Apex Flame Droplet -->
    <path d="M 300,32 C 309,46 312,56 308,66 C 305,74 295,74 292,66 C 288,56 291,46 300,32 Z" 
          fill="url(#flameGold)" 
          stroke="url(#embossGold)" 
          stroke-width="1.5"/>
    <path d="M 300,42 C 304,50 306,57 304,62 C 302,66 298,66 296,62 C 294,57 296,50 300,42 Z" 
          fill="#FFEEC0" 
          opacity="0.8"/>

    <!-- ══════════════════════════════════════════════════════════
         2. FIVE-PETAL GOLDEN LOTUS EMBLEM
         ══════════════════════════════════════════════════════════ -->
    <!-- Center Vertical Petal (Flame / Seed) -->
    <path d="M 300,74 C 314,95 320,116 314,142 C 308,162 302,176 300,188 C 298,176 292,162 286,142 C 280,116 286,95 300,74 Z" 
          fill="url(#embossGold)"/>
    <!-- Center Petal Inner Hollow -->
    <path d="M 300,94 C 306,108 308,122 305,138 C 302,150 299,158 300,166 C 301,158 298,150 295,138 C 292,122 294,108 300,94 Z" 
          fill="#AA3B10" 
          opacity="0.6"/>

    <!-- Left Inner Petal -->
    <path d="M 300,186 C 292,168 276,148 258,130 C 242,114 242,106 244,106 C 248,106 266,120 280,140 C 292,158 298,174 300,186 Z" 
          fill="url(#embossGold)"/>

    <!-- Right Inner Petal -->
    <path d="M 300,186 C 308,168 324,148 342,130 C 358,114 358,106 356,106 C 352,106 334,120 320,140 C 308,158 302,174 300,186 Z" 
          fill="url(#embossGold)"/>

    <!-- Left Outer Leaf Petal (Curving horizontal) -->
    <path d="M 298,190 C 274,188 238,178 206,164 C 180,152 176,144 178,142 C 182,140 206,140 236,150 C 266,160 288,178 298,190 Z" 
          fill="url(#flameGold)"/>

    <!-- Right Outer Leaf Petal (Curving horizontal) -->
    <path d="M 302,190 C 326,188 362,178 394,164 C 420,152 424,144 422,142 C 418,140 394,140 364,150 C 334,160 312,178 302,190 Z" 
          fill="url(#flameGold)"/>

    <!-- Lower Lotus Base Calyx Calyx / Leaves -->
    <path d="M 300,196 C 292,186 280,180 268,178 C 278,184 286,192 292,204 L 300,214 L 308,204 C 314,192 322,184 332,178 C 320,180 308,186 300,196 Z" 
          fill="url(#embossGold)"/>

    <!-- ══════════════════════════════════════════════════════════
         3. "PRISHKA" WORDMARK
         ══════════════════════════════════════════════════════════ -->
    <text x="300" y="270" 
          text-anchor="middle" 
          font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
          font-size="64" 
          font-weight="700" 
          letter-spacing="10" 
          fill="url(#embossGold)">
      PRISHKA
    </text>

    <!-- Sprout Leaves on 'A' -->
    <g transform="translate(452, 238) scale(0.8)">
      <path d="M 0,16 C 8,10 16,6 26,6 C 26,14 20,22 10,24 C 6,25 0,22 0,16 Z" fill="url(#embossGold)"/>
      <path d="M 4,22 C 10,24 16,30 20,38 C 12,38 6,34 2,28 C 0,24 2,22 4,22 Z" fill="url(#embossGold)"/>
    </g>

    <!-- ══════════════════════════════════════════════════════════
         4. HORIZONTAL RULE LINES & "ANNAM"
         ══════════════════════════════════════════════════════════ -->
    <!-- Left Rule Line -->
    <line x1="110" y1="306" x2="190" y2="306" stroke="url(#embossGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- "ANNAM" Sub-wordmark -->
    <text x="300" y="316" 
          text-anchor="middle" 
          font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
          font-size="32" 
          font-weight="600" 
          letter-spacing="16" 
          fill="url(#embossGold)">
      ANNAM
    </text>

    <!-- Right Rule Line -->
    <line x1="410" y1="306" x2="490" y2="306" stroke="url(#embossGold)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

