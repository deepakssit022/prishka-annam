<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" role="img" aria-label="Prishka Annam Logo">
  <defs>
    <!-- Royal Maroon Gradient -->
    <radialGradient id="maroonGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#8E2333"/>
      <stop offset="60%" stop-color="#6E1724"/>
      <stop offset="100%" stop-color="#4A0B14"/>
    </radialGradient>
    
    <!-- Rich Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE092"/>
      <stop offset="25%" stop-color="#D4A446"/>
      <stop offset="50%" stop-color="#FFF3C4"/>
      <stop offset="75%" stop-color="#B88628"/>
      <stop offset="100%" stop-color="#E5BC58"/>
    </linearGradient>

    <!-- Subtle Mandala Pattern -->
    <filter id="badgeShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3A070E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Mandala Rays (Faint Golden Lotus) -->
  <g opacity="0.4" stroke="url(#goldGrad)" stroke-width="0.75" fill="none" transform="translate(120, 85)">
    <circle r="72" stroke-dasharray="2,3"/>
    <circle r="64"/>
    <g id="petalGroup">
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(30)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(60)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(90)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(120)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(150)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(180)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(210)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(240)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(270)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(300)"/>
      <path d="M 0,-64 C 8,-50 8,-35 0,-25 C -8,-35 -8,-50 0,-64 Z" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Ornate Royal Arch Badge (Outer & Inner Fill) -->
  <g filter="url(#badgeShadow)">
    <!-- Main Crest Silhouette (Indian Traditional Temple / Jharokha Arch) -->
    <path d="M 120,12 
             C 132,24 146,26 156,26 
             C 172,26 182,34 186,48 
             C 190,56 196,62 196,72
             L 196,134 
             C 196,146 186,156 174,156 
             L 66,156 
             C 54,156 44,146 44,134 
             L 44,72
             C 44,62 50,56 54,48 
             C 58,34 68,26 84,26 
             C 94,26 108,24 120,12 Z" 
          fill="url(#maroonGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- Inner Filigree Border -->
    <path d="M 120,19 
             C 130,29 144,31 153,31 
             C 166,31 175,37 179,49 
             C 182,56 188,62 188,71
             L 188,128 
             C 188,138 180,148 170,148 
             L 70,148 
             C 60,148 52,138 52,128 
             L 52,71
             C 52,62 58,56 61,49 
             C 65,37 74,31 87,31 
             C 96,31 110,29 120,19 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="1" 
          stroke-opacity="0.8"
          stroke-dasharray="3,1.5"/>

    <!-- Corner Decorative Accents -->
    <circle cx="56" cy="144" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="184" cy="144" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="120" cy="24" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <!-- 1. PRISHKA -->
  <text x="120" y="66" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, 'Cinzel', serif" 
        font-size="20" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#FFFFFF">
    PRISHKA
  </text>

  <!-- 2. ANNAM -->
  <text x="120" y="98" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, 'Cinzel', serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="4" 
        fill="url(#goldGrad)">
    ANNAM
  </text>

  <!-- Golden Divider with Center Diamond -->
  <g transform="translate(120, 112)">
    <line x1="-58" y1="0" x2="-10" y2="0" stroke="url(#goldGrad)" stroke-width="1"/>
    <polygon points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="url(#goldGrad)"/>
    <circle cx="-16" cy="0" r="1.5" fill="url(#goldGrad)"/>
    <circle cx="16" cy="0" r="1.5" fill="url(#goldGrad)"/>
    <line x1="10" y1="0" x2="58" y2="0" stroke="url(#goldGrad)" stroke-width="1"/>
  </g>

  <!-- 3. Subtitle / Tagline -->
  <text x="120" y="132" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="6" 
        font-weight="700" 
        letter-spacing="1.8" 
        fill="#FCE092">
    NATURE'S PUREST GOLDEN DELIGHT
  </text>
  
  <text x="120" y="142" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="5" 
        font-weight="600" 
        letter-spacing="1.2" 
        fill="#EAD9BD"
        opacity="0.9">
    HAND-PICKED BIHAR MAKHANA
  </text>
</svg>

