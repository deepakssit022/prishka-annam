<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Jumbo Bihar Makhana Puff">
  <defs>
    <radialGradient id="makhanaGlow2" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAF1E0"/>
      <stop offset="80%" stop-color="#DECBAD"/>
      <stop offset="94%" stop-color="#B89B74"/>
      <stop offset="100%" stop-color="#845F36"/>
    </radialGradient>
    <radialGradient id="roastSpeck2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4E2B0D" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#7C4E20" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C29352" stop-opacity="0"/>
    </radialGradient>
    <filter id="puffShadow2" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#2D1A10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#puffShadow2)">
    <!-- Irregular puffy contour -->
    <path d="M 44,10
             C 64,8 82,18 90,34
             C 98,52 94,74 80,88
             C 66,98 44,96 28,88
             C 12,80 6,62 8,44
             C 10,26 24,12 44,10 Z" 
          fill="url(#makhanaGlow2)"/>

    <!-- Natural deep crevice folds -->
    <path d="M 32,28 C 42,34 50,46 46,62 C 43,72 38,78 30,82" 
          fill="none" 
          stroke="#BA9B76" 
          stroke-width="2.8" 
          stroke-linecap="round" 
          opacity="0.55"/>

    <path d="M 58,22 C 68,34 72,50 68,66 C 64,76 56,84 48,88" 
          fill="none" 
          stroke="#BA9B76" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          opacity="0.5"/>

    <!-- Roasted natural marks -->
    <ellipse cx="58" cy="52" rx="4.5" ry="3.5" fill="url(#roastSpeck2)"/>
    <ellipse cx="38" cy="42" rx="3" ry="2" fill="url(#roastSpeck2)"/>
    <ellipse cx="72" cy="38" rx="2.5" ry="2" fill="url(#roastSpeck2)"/>
    <ellipse cx="44" cy="74" rx="3.5" ry="2.5" fill="url(#roastSpeck2)"/>
    
    <ellipse cx="40" cy="20" rx="12" ry="7" fill="#FFFFFF" opacity="0.7" transform="rotate(-15 40 20)"/>
  </g>
</svg>

